name: "houseuk"
version: "1.0.0"
config-version: 2
profile: "houseuk"

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  raw_bucket: "quibbler-house-data-lake"
  raw_prefix: "raw"
  curated_prefix: "curated"
  airbnb_cities: ["bristol", "edinburgh", "greater-manchester", "london"]
  rightmove_rent_key: "raw/rightmove/rent/latest/*.json"
  rightmove_sale_key: "raw/rightmove/sale/latest/*.json"
  geojson_key: "raw/geojson/*.geojson"
  land_registry_complete_key: "raw/land_registry/pp-complete.csv"
  land_registry_monthly_key: "raw/land_registry/pp-monthly-update-new-version.csv"

models:
  houseuk:
    staging:
      +materialized: view
    marts:
      +materialized: table
